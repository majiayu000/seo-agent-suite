name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        run: python3 -m pip install -e .

      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py

      - name: Validate plugin structure
        run: python3 tests/test_structure.py

      - name: Test script behavior
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install browser acceptance prerequisites
        run: |
          npm install --prefix "$RUNNER_TEMP/seo-browser" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/seo-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Test controlled browser fixtures
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=16x16:r=1 \
            -t 1 -an -c:v libvpx "$RUNNER_TEMP/seo-browser/fixture.webm"
          NODE_PATH="$RUNNER_TEMP/seo-browser/node_modules" node tests/browser_acceptance.cjs \
            "$RUNNER_TEMP/seo-browser/artifacts" "$RUNNER_TEMP/seo-browser/fixture.webm" --fixtures-only
