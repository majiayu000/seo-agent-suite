name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py

      - name: Validate plugin structure
        run: python3 tests/test_structure.py

      - name: Test script behavior
        run: python3 tests/test_scripts.py
